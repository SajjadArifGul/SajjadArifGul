<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Production metrics">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" rx="20" fill="#07090f" stroke="#a78bfa" stroke-opacity="0.28"/>
  <text x="28" y="32" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5">PRODUCTION TELEMETRY  ·  NOT VANITY METRICS</text>

  <!-- card 1 -->
  <g transform="translate(20,48)">
    <rect width="216" height="140" rx="16" fill="url(#card)" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="20" y="32" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">UPTIME</text>
    <text x="20" y="82" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">10+</text>
    <text x="20" y="108" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">years shipping</text>
    <rect x="20" y="122" width="176" height="4" rx="2" fill="#1e1b4b"/>
    <rect x="20" y="122" width="20" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="40;176;40" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 2 -->
  <g transform="translate(256,48)">
    <rect width="216" height="140" rx="16" fill="url(#card)" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="20" y="32" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">RELEASES</text>
    <text x="20" y="82" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">100+</text>
    <text x="20" y="108" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">production deploys</text>
    <rect x="20" y="122" width="176" height="4" rx="2" fill="#1e1b4b"/>
    <rect x="20" y="122" width="20" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="60;176;60" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 3 -->
  <g transform="translate(492,48)">
    <rect width="216" height="140" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="20" y="32" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">ENDPOINTS</text>
    <text x="20" y="82" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">120+</text>
    <text x="20" y="108" fill="#67e8f9" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">fintech APIs</text>
    <rect x="20" y="122" width="176" height="4" rx="2" fill="#082f49"/>
    <rect x="20" y="122" width="20" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="80;176;80" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 4 -->
  <g transform="translate(728,48)">
    <rect width="216" height="140" rx="16" fill="url(#card)" stroke="#22c55e" stroke-opacity="0.35"/>
    <text x="20" y="32" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">USERS</text>
    <text x="20" y="82" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">5K+</text>
    <text x="20" y="108" fill="#86efac" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">on systems I built</text>
    <rect x="20" y="122" width="176" height="4" rx="2" fill="#052e16"/>
    <rect x="20" y="122" width="20" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="50;176;50" dur="4.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 5 -->
  <g transform="translate(964,48)">
    <rect width="216" height="140" rx="16" fill="url(#card)" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="20" y="32" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">SALES</text>
    <text x="20" y="82" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">700+</text>
    <text x="20" y="108" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">CodeCanyon products</text>
    <rect x="20" y="122" width="176" height="4" rx="2" fill="#052e16"/>
    <rect x="20" y="122" width="20" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="70;176;70" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
